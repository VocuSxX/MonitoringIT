route:
  receiver: discord
  group_by: ["alertname", "hostname"]
  group_wait: 30s
  group_interval: 2m
  repeat_interval: 1h

inhibit_rules:
  - source_matchers:
      - alertname = SerwerNiedostepny
    target_matchers:
      - severity = warning
    equal: ["hostname"]

receivers:
  - name: discord
    discord_configs:
      - webhook_url_file: /run/secrets/discord_webhook_url
        send_resolved: true
        title: '{{ if eq .Status "firing" }}[ALARM]{{ else }}[OK]{{ end }} {{ .CommonLabels.alertname }}'
        message: |
          {{ range .Alerts }}
          **{{ .Annotations.summary }}**
          {{ .Annotations.description }}
          Serwer: {{ or .Labels.hostname .Labels.instance }} | Ważność: {{ .Labels.severity }}
          {{ end }}
