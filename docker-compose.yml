services:
  windows-exporter:
    build: ./exporter
    image: monitoring/windows-exporter:local
    container_name: windows-exporter
    restart: unless-stopped
    environment:
      WIN_TARGETS: "100.64.3.7=WIN-LAB"
      WIN_USER: prom_monitor
      WIN_PASSWORD_FILE: /run/secrets/windows_password
      WIN_SERVICES: "Spooler,W32Time"
    secrets:
      - windows_password
    ports:
      - "9182:9182"

  prometheus:
    image: prom/prometheus:v3.16.0
    container_name: prometheus
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=15d
      - --web.enable-lifecycle
    volumes:
      - ./prometheus:/etc/prometheus:ro
      - prometheus_data:/prometheus
    ports:
      - "9090:9090"
    depends_on:
      - windows-exporter

  alertmanager:
    image: prom/alertmanager:v0.34.2
    container_name: alertmanager
    restart: unless-stopped
    command:
      - --config.file=/etc/alertmanager/alertmanager.yml
      - --storage.path=/alertmanager
    volumes:
      - ./alertmanager:/etc/alertmanager:ro
      - alertmanager_data:/alertmanager
    secrets:
      - discord_webhook_url
    ports:
      - "9093:9093"

  grafana:
    image: grafana/grafana:13.3.0
    container_name: grafana
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?Ustaw GRAFANA_ADMIN_PASSWORD w pliku .env}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/etc/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    ports:
      - "3000:3000"
    depends_on:
      - prometheus

secrets:
  windows_password:
    file: ./secrets/windows_password
  discord_webhook_url:
    file: ./secrets/discord_webhook_url

volumes:
  prometheus_data:
  alertmanager_data:
  grafana_data:
